        .titulo-contornado { font-weight: 700; color: white; text-transform: uppercase; text-shadow: -2px -2px 0 var(--azul-terelepe), 2px -2px 0 var(--azul-terelepe), -2px 2px 0 var(--azul-terelepe), 2px 2px 0 var(--azul-terelepe), 4px 4px 0px rgba(0,0,0,0.1); line-height: 0.9; }
        .btn-filtro { padding: 0.6rem 1.5rem; border-radius: 9999px; font-weight: 700; border: 2px solid var(--roxo-terelepe); color: var(--roxo-terelepe); background: white; transition: all 0.3s ease; white-space: nowrap; }
        .btn-filtro.active { background-color: var(--roxo-terelepe); color: white; box-shadow: 0 4px 15px rgba(123, 63, 228, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #painel-carrinho, #modal-detalhes { transition: all 0.3s ease-in-out; }
        .card-fantasia { backdrop-filter: blur(5px); background: rgba(255, 255, 255, 0.9); }
    </style>
</head>

        let carrinho = JSON.parse(localStorage.getItem('carrinho_terelepe')) || [];

        function obterPrecos(item) {            return {
                aluguel: item.aluguel || VALOR_PADRAO_ALUGUEL,
                venda: item.venda || VALOR_PADRAO_VENDA
            };
        }

        function renderizarSite(filtro = "Todas") {
            const vitrine = document.getElementById('lista-fantasias');
            vitrine.innerHTML = "";
            const filtrados = filtro === "Todas" ? minhasFantasias : minhasFantasias.filter(f => f.categoria === filtro);
            
            filtrados.forEach(item => {
                const p = obterPrecos(item);
                vitrine.innerHTML += `
                    <div class="card-fantasia rounded-[2.5rem] shadow-xl overflow-hidden border border-white flex flex-col hover:translate-y-[-10px] transition-all cursor-pointer" onclick="abrirModal(${item.id})">
                        <img src="${item.foto}" class="w-full h-80 object-cover" onerror="this.src='https://placehold.co/400x600?text=Foto+em+Breve'">
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-800 mb-1">${item.nome}</h3>
                            <p class="text-purple-500 font-bold mb-4 italic">${item.categoria} - Tam: ${item.tamanho}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-gray-400">Ver mais →</span>
                                <span class="bg-purple-100 px-3 py-1 rounded-full text-purple-600 font-bold text-lg">R$ ${p.aluguel}</span>
                            </div>
                        </div>
                    </div>`;
            });
            atualizarCarrinho();
        }

        function abrirModal(id) {
            const item = minhasFantasias.find(f => f.id === id);
            const p = obterPrecos(item);
            const conteudo = document.getElementById('conteudo-modal');
            conteudo.innerHTML = `
                <div class="w-full md:w-1/2">
                    <img src="${item.foto}" class="w-full h-[400px] object-cover rounded-3xl shadow-lg" onerror="this.src='https://placehold.co/400x600?text=Foto+em+Breve'">
                </div>
                <div class="w-full md:w-1/2 flex flex-col">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">${item.nome}</h2>
                    <span class="text-purple-600 font-bold mb-4">${item.categoria} | Tamanho: ${item.tamanho}</span>
                    <p class="text-gray-600 mb-6 flex-grow">Fantasia oficial Terelepe. Perfeita para festas temáticas e eventos. Material confortável e ajustável ao corpo.</p>
                    <div class="grid grid-cols-1 gap-4">
                        <button onclick="addCarrinho(${item.id}, 'Aluguel')" class="bg-purple-600 hover:bg-purple-700 text-white p-4 rounded-2xl font-bold text-lg transition flex justify-between items-center">
                            <span>ALUGAR</span><span>R$ ${p.aluguel}</span>
                        </button>
                        <button onclick="addCarrinho(${item.id}, 'Venda')" class="bg-pink-100 hover:bg-pink-200 text-pink-600 p-4 rounded-2xl font-bold text-lg transition flex justify-between items-center">
                            <span>COMPRAR</span><span>R$ ${p.venda}</span>
                        </button>
                    </div>
                </div>`;
            document.getElementById('modal-detalhes').classList.remove('hidden');
        }

        // 1. PRIMEIRO AS CONFIGURAÇÕES (Não esqueça de colocar seu link e número aqui!)
        const WHATSAPP_LOJA = "5511963267337"; // Substitua pelo seu celular com DDD
        const LINK_MERCADO_PAGO = "link.mercadopago.com.br/terelepefantasias"; // Seu link de valor aberto

        // 2. DEPOIS AS FUNÇÕES
        function fecharModal() { 
            document.getElementById('modal-detalhes').classList.add('hidden'); 
        }

        function addCarrinho(id, tipo) {
            const f = minhasFantasias.find(i => i.id === id);
            const p = obterPrecos(f);
            carrinho.push({ ...f, tipoPedido: tipo, precoFinal: tipo === 'Aluguel' ? p.aluguel : p.venda });
            localStorage.setItem('carrinho_terelepe', JSON.stringify(carrinho));
            atualizarCarrinho();
            fecharModal();
            toggleCarrinho(true);
        }

        function atualizarCarrinho() {
            const contagem = document.getElementById('contagem-carrinho');
            const lista = document.getElementById('itens-carrinho');
            const totalElemento = document.getElementById('total-carrinho');
            
            if(!contagem || !lista || !totalElemento) return;

            contagem.innerText = carrinho.length;
            let total = 0;
            lista.innerHTML = "";
            
            carrinho.forEach((item, index) => {
                total += item.precoFinal;
                lista.innerHTML += `
                <div class="flex items-center gap-4 bg-gray-50 p-3 rounded-xl border">
                    <img src="${item.foto}" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-grow text-xs font-bold">${item.nome}<br><span class="text-purple-500">${item.tipoPedido} - R$ ${item.precoFinal}</span></div>
                    <button onclick="remover(${index})" class="text-red-500 text-2xl">&times;</button>
                </div>`;
            });
            totalElemento.innerText = `R$ ${total.toFixed(2)}`;
        }

        function remover(i) { 
            carrinho.splice(i, 1); 
            localStorage.setItem('carrinho_terelepe', JSON.stringify(carrinho)); 
            atualizarCarrinho(); 
        }

        function toggleCarrinho(abrir = false) { 
            const p = document.getElementById('painel-carrinho');
            if (abrir === true) p.classList.remove('translate-x-full');
            else p.classList.toggle('translate-x-full');
        }

        function filtrar(cat, btn) {
            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderizarSite(cat);
        }

        // LÓGICA DE PAGAMENTO E WHATSAPP
        function finalizarWhatsApp() {
            if (carrinho.length === 0) return alert("Adicione itens ao carrinho!");
            let total = 0;
            let msg = "⭐ *PEDIDO SITE TERELEPE* ⭐\n\n";
            carrinho.forEach(i => {
                msg += `✅ *${i.nome}*\nTipo: ${i.tipoPedido}\nPreço: R$ ${i.precoFinal}\n\n`;
                total += i.precoFinal;
            });
            msg += `💰 *TOTAL: R$ ${total.toFixed(2)}*\n\n_Quero confirmar a disponibilidade para a minha festa!_`;
            window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function finalizarMercadoPago() {
            if (carrinho.length === 0) return alert("Seu carrinho está vazio!");
            
            let total = 0;
            carrinho.forEach(i => total += i.precoFinal);

            alert("O total do seu pedido é R$ " + total.toFixed(2) + ".\n\nInforme este valor na página do Mercado Pago para concluir.");
            
            window.location.href = MERCADO_PAGO_LIVRE;
        }

        // Inicializa o site
        renderizarSite();
